# A cada commit na branch main: gera o índice de textos e publica o site no GitHub Pages.
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar índice dos textos
        run: node scripts/build-index.mjs
      - name: Montar pasta do site
        run: |
          mkdir -p _site
          for f in index.html arquivo.html sobre.html post.html css js img posts; do
            if [ -e "$f" ]; then cp -r "$f" _site/; else echo "Aviso: $f não encontrado"; fi
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
